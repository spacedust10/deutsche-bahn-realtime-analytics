name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dbrt
          POSTGRES_PASSWORD: dbrt
          POSTGRES_DB: dbrt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dbrt"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: dbrt
      PGPASSWORD: dbrt
      PGDATABASE_TEST: dbrt_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Network-marked tests are excluded: CI must not depend on a live
        # upstream feed being reachable and unchanged.
        run: python -m pytest -m "not network" -v
