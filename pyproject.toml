[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbrt"
version = "0.1.0"
description = "Realtime GTFS-RT ingestion and delay analytics for DB Fernverkehr long-distance trains (ICE/IC/EC)"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["dbrt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: hits a live upstream feed (deselect with -m 'not network')",
    "postgres: needs a reachable PostgreSQL instance (deselect with -m 'not postgres')",
]

[tool.ruff]
line-length = 118
target-version = "py310"
# Notebook cells legitimately use `plt.tight_layout(); plt.show()` on one line.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # line length is handled by the formatter, not the linter
    "B008",   # FastAPI's Query() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside functions to keep red states isolated to one module.
"tests/*" = ["E402", "F401"]
